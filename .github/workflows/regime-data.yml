name: Regular-spot regime data snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
jobs:
  collect-public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Fetch public BTC/ETH/SOL data only
        run: bash scripts/collect_regime_data.sh
      - uses: actions/upload-artifact@v4
        with:
          name: regime-trend-btc-eth-sol-${{ github.run_id }}
          path: |
            data/kraken_*_60m.csv
            data/kraken_*_240m.csv
            data/kraken_*_1440m.csv
            data/regime_trend_v1_collection.json
          retention-days: 30
